# Builds the image, tests and scans it, pushes it to GHCR by digest, and commits
# that digest to camircode/gitops. Argo CD does the deploying; this workflow never
# touches the cluster, so the git log of camircode/gitops stays the real
# deployment history.
#
# This replaces the Jenkinsfile that did the same job on the homelab's Jenkins,
# stage for stage. The shell in each step was moved over unchanged.
#
# Pull requests run only the first step. They get no secrets (GitHub withholds
# them from forks), so nothing that publishes or deploys can run from one, and
# `pull_request_target` is deliberately not used. Only a push to main updates
# gitops; a push to ci/** goes as far as the scan, which is how a change to this
# file gets tried without deploying anything.
name: ci

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# disableConcurrentBuilds in the Jenkinsfile: queue, never cancel a build that
# may be halfway through publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: 'ghcr.io'
  IMAGE: 'ghcr.io/camircode/demo-api'
  GITOPS: 'git@github.com:camircode/gitops.git'
  MANIFEST: 'manifests/demo-api/deployment.yaml'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: |
          docker run --rm -e CGO_ENABLED=1 -v "$PWD":/src -w /src golang:1.24 \
            sh -c 'go vet ./... && go test -race -count=1 ./...'


      - name: Compute build metadata
        if: github.event_name != 'pull_request'
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          echo "$GHCR_PASS" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

          docker buildx create --use --name builder 2>/dev/null || docker buildx use builder

          # The tag exists so a human can find the build; the digest
          # is what gets deployed. --metadata-file is how the digest
          # comes back without a second registry round trip.
          docker buildx build \
            --push \
            --provenance=false \
            --build-arg VERSION="$SHORT_SHA" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --tag "$IMAGE:$SHORT_SHA" \
            --metadata-file metadata.json \
            .


      - name: Record the image digest
        if: github.event_name != 'pull_request'
        run: |
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE}@${digest}"

      - name: Update the desired state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -eu
          # The one credential here that can change what runs in the cluster without a
          # human merging something. It is a deploy key on camircode/gitops alone.
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$HOME/.ssh/gitops"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitops -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          rm -rf gitops
          git clone --depth 1 "$GITOPS" gitops
          cd gitops
          git config user.email "ci@camir.tech"
          git config user.name  "github-actions"

          sed -i -E "s#image: .*demo-api@sha256:[a-f0-9]+#image: ${IMAGE}@${IMAGE_DIGEST}#" "$MANIFEST"
          sed -i -E "s#image: traefik/whoami@sha256:[a-f0-9]+#image: ${IMAGE}@${IMAGE_DIGEST}#" "$MANIFEST"

          if git diff --quiet; then
            echo "Already at ${IMAGE_DIGEST}; nothing to commit."
            exit 0
          fi

          git add "$MANIFEST"
          git commit -m "deploy(demo-api): ${IMAGE_DIGEST}

          Built from camircode/demo-api@${GITHUB_SHA} by GitHub Actions run ${GITHUB_RUN_ID}."

          # Every application pushes to this one repository, so two builds finishing
          # together will race. Their manifests are different files, so rebasing never
          # conflicts; it only has to be done.
          for attempt in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push rejected (attempt $attempt); rebasing onto the new tip"
            git fetch --depth 1 origin main
            git rebase origin/main
          done
          echo "could not push to gitops after 5 attempts" >&2
          exit 1

      - name: Clean up credentials
        if: always()
        run: |
          docker logout ghcr.io || true
